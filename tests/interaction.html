<!doctype html><html lang="zh-CN"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dde8ea"><title>一瓶春山 · 画中造境</title><meta name="description" content="以鼠标为笔，画山起峰；在瓶边定下落点，让屋舍、林木和春花在山水中生长。"><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%239a5142'/%3E%3Ctext x='11' y='45' font-size='40' fill='%23eee8d5'%3E山%3C/text%3E%3C/svg%3E"><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head><body>
<div id="scene"></div><div class="vignette"></div><svg id="connection" aria-hidden="true"><path id="connectionPath" d=""/></svg>
<header><div class="brand"><b>春山</b><span>一瓶春山<small>DRAW A MOUNTAIN · PLANT A WORLD</small></span></div><p>以 笔 起 山 · 借 花 造 境</p></header>
<div id="lead"><span>按 住 鼠 标 · 在 画 中 运 笔</span><h1>落一笔，山河起。</h1><p>笔迹决定山势；重描一处，山峰渐高。<br>右键拖动，转身看山。</p></div>
<aside id="vaseDock" aria-label="花瓶与落点控制" hidden inert><div class="dock-heading"><span>瓶 中 春 色</span><small id="total">零枝 · 待春</small></div><div id="vaseView"><canvas id="vaseCanvas" aria-label="三维插花预览"></canvas><div class="orbit-ring"></div><div class="orbit-cross"></div><button id="placementPad" aria-label="点击花瓶周围的位置，决定画中生长落点"><span id="padPoint" hidden></span></button><div id="compass"><span>远</span><span>右</span><span>近</span><span>左</span></div><p id="placementHint">先画山，再拾一枝春色。</p></div>
<div class="materials"><button class="material" data-kind="branch" aria-pressed="false"><svg viewBox="0 0 70 55"><path d="M11 50Q39 31 50 6M31 34L24 14M41 22L61 17"/></svg><span>梅枝<small>生亭屋</small></span><b id="count-branch">00</b></button><button class="material" data-kind="leaf" aria-pressed="false"><svg viewBox="0 0 70 55"><path d="M14 49L49 8"/><path class="leaf-icon" d="M27 36Q10 23 20 20Q31 19 27 36M36 27Q52 33 54 19Q43 16 36 27M44 18Q30 6 40 5Q50 6 44 18"/></svg><span>青叶<small>生林木</small></span><b id="count-leaf">00</b></button><button class="material" data-kind="flower" aria-pressed="false"><svg viewBox="0 0 70 55"><path d="M16 50L44 14M30 34L54 28"/><g class="flower-icon"><circle cx="45" cy="10" r="6"/><circle cx="39" cy="15" r="6"/><circle cx="47" cy="19" r="6"/><circle cx="52" cy="14" r="6"/></g></svg><span>春花<small>生花树</small></span><b id="count-flower">00</b></button></div><p class="dock-instruction" id="selection">选花材 → 移动到瓶边 → 点击定落点</p><div id="branchTools" hidden><label for="branchSelect">已插枝条</label><select id="branchSelect" aria-label="选择枝条及对应建筑"></select><div><button id="swapStyle">换一种</button><button id="removeBranch">撤去这枝</button><small id="branchInfo"></small></div></div><div class="dock-tools"><button id="undo" disabled>撤去末枝</button><button id="cancel" hidden>取消落点</button><a href="architecture/" target="_blank" rel="noopener">查看建筑造型 ↗</a></div></aside>
<div id="status" role="status" aria-live="polite">一屏山水，等你落笔。</div><nav class="toolbar" aria-label="画境工具"><button id="drawMode" class="active" aria-pressed="true">✎ 画山</button><button id="viewMode" aria-pressed="false">⌘ 观山</button><span></span><button id="demoBtn">看一幅示例</button><button id="clearBtn">清空画境</button><button id="setBtn" aria-expanded="false">风格 ☷</button></nav><div id="panel" hidden><p>画 面 风 格</p><div id="themeChips"></div><div class="rotate-row"><span>自动游览</span><button id="rotSwitch" role="switch" aria-checked="false" aria-label="自动旋转"><i></i></button></div></div>
<div class="bottom-note"><span id="tips">左键画山 · 右键旋转 · 滚轮缩放</span></div><div id="err" hidden>三维画境未能启动。请启用浏览器硬件加速后刷新。</div><script type="module" src="app.js?v=branch-tools16-merged"></script><div style="position:fixed;left:15px;top:110px;z-index:99;background:white;padding:8px"><button id="inspectSites">检查地形可用点</button><select id="testType"><option value="pavilion">亭子</option><option value="house">房屋</option></select><button id="insertTestBranch">测试插枝</button><pre id="siteResults"></pre></div><script type="module">
import {landscape as world} from './landscape.js?v=dry14';
import {inspectSite} from './architecture/buildings.js';
import {selectMaterial,placeAt} from './app.js?v=branch-tools16-merged';
import * as THREE from 'three';
let sites=[];
document.querySelector('#inspectSites').onclick=()=>{sites=[];for(let x=-20;x<=20;x+=.5)for(let z=-15;z<=15;z+=.5){const p={x,z},plan=inspectSite(world.surfaceAt,p,.8);if(plan.valid)sites.push({p,plan});}document.querySelector('#siteResults').textContent=JSON.stringify({house:sites.filter(s=>s.plan.type==='house').length,pavilion:sites.filter(s=>s.plan.type==='pavilion').length,first:sites[0]},null,2);};
document.querySelector('#insertTestBranch').onclick=()=>{if(!sites.length)return;const site=sites.find(s=>s.plan.type===document.querySelector('#testType').value)||sites[0];selectMaterial('branch');placeAt(site.p,new THREE.Vector3(.4,2.4,0));};
</script></body></html>
