<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一瓶春山 · 花枝造型</title>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#e9e7dd;color:#3f514b;font-family:"Songti SC",serif}
    canvas{display:block;width:100vw;height:100vh}
    header{position:fixed;left:30px;top:24px}
    h1{font-size:24px;font-weight:400;letter-spacing:4px;margin:12px 0}
    header p{font-size:12px;color:#6b776d;line-height:1.9}
    a{color:inherit}
    #name{position:fixed;left:30px;top:160px;font-size:16px;letter-spacing:2px}
    #habitatLabel{position:fixed;right:30px;top:35px;font-size:12px}
    nav{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(95%,920px)}
    button,select{font:inherit;color:inherit;background:#f7f5eb;border:1px solid #aeb8a7;padding:10px 16px;cursor:pointer}
    button small{display:block;font-size:10px;margin-top:3px}
    button[aria-pressed=true]{background:#4e6458;color:#fff}
    #error{position:fixed;top:40%;left:20%;background:#fff;padding:20px}
    [hidden]{display:none!important}
    @media(max-width:600px){header{left:18px;top:12px}h1{font-size:20px}#habitatLabel{right:18px;top:120px}#name{top:165px;left:18px}nav{bottom:22px}button,select{padding:8px 10px;font-size:12px}}
  </style>
</head>
<body>
  <canvas id="viewer" aria-label="可旋转缩放的五种画中春花模型"></canvas>
  <header><a href="../">← 返回插枝造境</a><h1>画 中 春 花</h1><p>玉兰 · 桃花 · 水仙 · 山茶花 · 杜鹃<br>拖动旋转，滚轮缩放；花型在画中自动搭配。</p></header>
  <label id="habitatLabel">生长地形 <select id="habitat"><option value="ground">平地</option><option value="mountain">山上</option></select></label>
  <p id="name" role="status"></p>
  <nav aria-label="查看五种画中花造型"></nav>
  <p id="error" hidden>三维预览未能启动，请开启浏览器硬件加速。</p>
  <script type="module" src="viewer.js?v=flowers20"></script>
</body>
</html>
